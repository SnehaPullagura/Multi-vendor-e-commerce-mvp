version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketsphere_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketsphere-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "MarketSphere Multi-Vendor Platform"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/marketsphere_db"
      JWT_SECRET: "marketsphere-production-super-secret-key-2026"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketsphere-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
